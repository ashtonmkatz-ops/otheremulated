 <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="initial-scale = 1.0,maximum-scale = 1.0" />
    <link rel="icon" type="image/png" href="https://static.qustodio.com/block-pages/v3/img/favicon.ico?v=3">
    <link rel="stylesheet" type="text/css" href="https://static.qustodio.com/block-pages/v3/css/style.css?v=3">
</head>

<body id="website_blocked_default_rules">
    <div id="content">
        <script id="content-tpl" type="x-tmpl-mustache">
            <div id="manage" class="manage">
                <a href="qustodiofamily://" id="settings" target="_blank">
                    {{{manage}}} <img src="https://static.qustodio.com/block-pages/v3/img/manage.svg" />
                </a>
            </div>

            <div class="content-wrapper">
                <div class="illustrations-wrapper">
                    <img class="top-illustration-simple" src='https://static.qustodio.com/block-pages/v3/img/top-illustration-simple.svg' />
                    <img class="top-illustration" src='https://static.qustodio.com/block-pages/v3/img/{{icon}}.svg' />
                </div>

                <h1>{{{title}}}</h1>

                <h2>{{{subtitle}}}</h2>
                
                <div class="tag-container">
                    {{#tags}}
                        <span class="tag">{{.}}</span>
                    {{/tags}}
                </div>
                
                <h3>{{{body}}}</h3>
                
                {{#button}}
                    <a href='{{{button_link}}}' class="button" target="_blank">{{{button}}}</a>
                {{/button}}

                {{#button_feedback}}
                    <div class="button-feedback">
                        <img src='https://static.qustodio.com/block-pages/v3/img/feedback-check.svg' />
                        <span>{{{button_feedback}}}</span>
                    </div>
                {{/button_feedback}}
            </div>
        </script>
        </div>
        <script>
            var blockPageLocale = "en";
            var blockPageType = "website_blocked_default_rules";
            var blockPageData = {"web_categories":[]};
            var staticUrl = "https://static.qustodio.com/block-pages/v3";
            var shortName = "Qustodio";
        </script>
        <script src="https://static.qustodio.com/block-pages/v3/js/app.js?v=3"></script>
    </body>
</html>
